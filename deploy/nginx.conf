# Nginx 反向代理配置
# 使用方式：
#   1. 将 api.your-domain.com 替换为实际域名（无域名则删掉 server_name 行，改用 IP）
#   2. sudo cp deploy/nginx.conf /etc/nginx/sites-available/bt-fit
#      sudo ln -s /etc/nginx/sites-available/bt-fit /etc/nginx/sites-enabled/
#      （CentOS 系放到 /etc/nginx/conf.d/bt-fit.conf）
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. 申请 HTTPS 证书: sudo certbot --nginx -d api.your-domain.com
server {
    listen 80;
    server_name api.your-domain.com;

    # 上传文件大小限制（当前接口均为小 JSON，默认即可）
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
